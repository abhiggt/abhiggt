<style>
  :root { --ink: #FFFFFF; }
  @media (prefers-color-scheme: light) { :root { --ink: #1F2328; } }
  path { fill: none; stroke-linecap: round; stroke-linejoin: round;
         animation-name: write; animation-timing-function: linear; animation-fill-mode: forwards; }
  #m path { stroke: #fff; }
  .word { fill: var(--ink); stroke: none; animation: none; }
  .ink { stroke: var(--ink); stroke-width: 2.4; }
  .star { stroke: var(--ink); stroke-width: 2.2; animation-timing-function: ease-in-out; }
  @keyframes write { to { stroke-dashoffset: 0; } }
  .tw { transform-box: fill-box; transform-origin: center; animation: tw 3.6s ease-in-out 5.10s infinite; }
  @keyframes tw { 0%,100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .55; transform: scale(.82) rotate(18deg); } }
</style>
